env STREAM_SECRET;

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

include /usr/local/openresty/nginx/conf/rtmp.conf;

http {
    client_max_body_size 10M;
    resolver 127.0.0.11 ipv6=off;

    lua_shared_dict stream_auth_cache 100m;

    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;


    keepalive_timeout 65;
    keepalive_requests 1000;

    gzip on;
    gzip_types application/dash+xml text/xml application/xml;
    gzip_min_length 256;

    # ================= CORS HELPERS =================

    map $request_method $cors_preflight {
        default 0;
        OPTIONS 1;
    }

    map $http_origin $cors_origin {
        default "*";
    }

    # ================= CACHE ZONES =================

    proxy_cache_path /var/cache/nginx/dash
    levels=1:2
    keys_zone=dash_cache:500m
    max_size=50g
    inactive=24h
    use_temp_path=off;

    proxy_cache_path /var/cache/nginx/live_manifest
    levels=1:2
    keys_zone=live_manifest_cache:50m
    inactive=10s
    max_size=1g
    use_temp_path=off;

    proxy_cache_path /var/cache/nginx/live_init
    levels=1:2
    keys_zone=live_init_cache:50m
    inactive=1h
    max_size=5g
    use_temp_path=off;

    proxy_cache_path /var/cache/nginx/live_chunks
    levels=1:2
    keys_zone=live_chunk_cache:200m
    inactive=30s
    max_size=20g
    use_temp_path=off;

    proxy_cache_path /var/cache/nginx/gift_assets
    levels=1:2
    keys_zone=gift_assets_cache:20m
    max_size=10g
    inactive=30d
    use_temp_path=off;

    proxy_cache_path /var/cache/nginx/thumbnail_assets
    levels=1:2
    keys_zone=thumbnail_cache:50m
    max_size=20g
    inactive=60d
    use_temp_path=off;

    # ================= CACHE CONTROL =================

    proxy_ignore_headers Set-Cookie;

    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_lock_age 10s;

    proxy_cache_background_update on;

    proxy_cache_use_stale
    error
    timeout
    updating
    http_500
    http_502
    http_503
    http_504;

    proxy_force_ranges on;

    # ================= INTERNAL LIVE STORAGE =================

    upstream live_backend {
        server 127.0.0.1:9099;
        keepalive 64;
    }

    server {
        listen 127.0.0.1:9099;

        location /internal_live/ {

            root /var/www/media;

            rewrite ^/internal_live/(.*)$ /$1 break;

            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;

            open_file_cache off;

            etag off;
            if_modified_since off;

            add_header Cache-Control "no-store" always;
        }
    }

    # ================= EDGE SERVER =================

    server {

        listen 80;

        location / {

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ================= API =================

        location /socket.io/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_pass http://host.docker.internal:3001;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400;
        }

        location /api/ {
            proxy_pass http://host.docker.internal:3001/;
        }

        location ~ ^/assets/gift/(images|effects|sounds)/([^/]+)$ {

            # example: http://minio:9000/gift/images/id.png|json|mp3...
            proxy_pass http://minio:9000/gift/$1/$2;

            proxy_cache gift_assets_cache;
            proxy_cache_key $uri;

            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;

            proxy_cache_lock on;
            proxy_buffering on;

            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            add_header Cache-Control "public, max-age=31536000, immutable" always;

            add_header X-Cache-Status $upstream_cache_status;
        }

        location ~ ^/assets/([^/]+)/([^/]+)$ {
            proxy_pass http://minio:9000/$1/$2;

            proxy_cache thumbnail_cache;
            proxy_cache_key $uri;

            proxy_cache_valid 200 60d;
            proxy_cache_valid 404 5m;

            proxy_cache_lock on;
            proxy_buffering on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            add_header Cache-Control "public, max-age=31536000, immutable";

            add_header X-Cache-Type "Thumbnail-Store";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ================= LIVE MANIFEST =================

        location ~ ^/live/streams/([^/]+)/manifest\.mpd$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            access_by_lua_block {
                local secret = os.getenv("STREAM_SECRET")

                local request_uri = ngx.var.request_uri
                local uri = request_uri:match("^[^?]+")

                local st = ngx.var.arg_st
                local e = ngx.var.arg_e

                if not st or not e then
                return ngx.exit(403)
                end

                if tonumber(e) < ngx.time() then
                return ngx.exit(410)
                end

                local raw = ngx.md5_bin(e .. uri .. " " .. secret)

                local expected = ngx.encode_base64(raw)
                expected = expected:gsub("=", "")
                expected = expected:gsub("%+", "-")
                expected = expected:gsub("/", "_")

                if expected ~= st then
                return ngx.exit(403)
                end

                local stream_id = ngx.var[1]

                local cache = ngx.shared.stream_auth_cache
                cache:set("live_"..st.."_"..stream_id,"1",7200)
            }

            rewrite ^/live/streams/([^/]+)/(.*)$ /internal_live/$1/$2 break;

            proxy_pass http://live_backend;

            proxy_cache live_manifest_cache;

            proxy_cache_key $uri$is_args$args;

            proxy_cache_valid 200 1s;

            proxy_cache_lock on;

            proxy_buffering on;

            proxy_cache_use_stale updating;

            proxy_ignore_headers Cache-Control Expires;

            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;

            proxy_pass_header Date;

            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # ================= LIVE INIT =================

        location ~ ^/live/streams/([^/]+)/init-[^/]+\.mp4$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            access_by_lua_block {
                local stream_id = ngx.var[1]
                local st = ngx.var.arg_st

                local cache = ngx.shared.stream_auth_cache

                if not cache:get("live_"..st.."_"..stream_id) then
                return ngx.exit(403)
                end

                cache:expire("live_"..st.."_"..stream_id,600)
            }

            rewrite ^/live/streams/([^/]+)/(.*)$ /internal_live/$1/$2 break;

            proxy_pass http://live_backend;

            proxy_cache live_init_cache;

            proxy_cache_key $uri;

            proxy_cache_valid 200 10m;

            proxy_cache_lock on;

            proxy_buffering on;

            add_header Cache-Control "public,max-age=600,immutable";
        }

        # ================= LIVE CHUNKS =================

        location ~ ^/live/streams/([^/]+)/chunk-[^/]+\.m4s$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            access_by_lua_block {
                local stream_id = ngx.var[1]
                local st = ngx.var.arg_st
                local cache = ngx.shared.stream_auth_cache

                if not cache:get("live_"..st.."_"..stream_id) then
                return ngx.exit(403)
                end

                cache:expire("live_"..st.."_"..stream_id,600)
            }

            rewrite ^/live/streams/([^/]+)/(.*)$ /internal_live/$1/$2 break;

            proxy_pass http://live_backend;

            proxy_cache live_chunk_cache;

            proxy_cache_key $uri;

            proxy_cache_valid 200 20s;

            proxy_cache_lock off;

            proxy_buffering off;

            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

            add_header Cache-Control "public,max-age=3,immutable";
        }

        # ================= VOD MANIFEST =================

        location ~ ^/vod/streams/([^/]+)/vod\.mpd$ {

            access_by_lua_block {
                local secret = os.getenv("STREAM_SECRET")

                local uri = ngx.var.uri
                local request_uri = ngx.var.request_uri
                local st = ngx.var.arg_st
                local e = ngx.var.arg_e

                if not st or not e then
                return ngx.exit(403)
                end

                if tonumber(e) < ngx.time() then
                return ngx.exit(410)
                end

                local raw = ngx.md5_bin(e .. uri .. " " .. secret)

                local expected = ngx.encode_base64(raw)
                expected = expected:gsub("=", "")
                expected = expected:gsub("%+", "-")
                expected = expected:gsub("/", "_")

                if expected ~= st then
                return ngx.exit(403)
                end

                local stream_id = ngx.var[1]

                local cache = ngx.shared.stream_auth_cache
                cache:set("vod_"..st.."_"..stream_id,"1",14400)
            }

            proxy_pass http://minio:9000/hls-streams/streams/$1/vod.mpd;

            proxy_cache dash_cache;

            proxy_cache_key $scheme$proxy_host$request_uri;

            proxy_cache_valid 200 24h;
            proxy_cache_valid 206 0;
            proxy_cache_valid 404 5s;

            add_header Cache-Control "public,max-age=86400";
        }

        # ================= VOD SEGMENTS =================

        location ~ ^/vod/streams/([^/]+)/((init-|chunk-).*\.(mp4|m4s))$ {

            access_by_lua_block {

                local stream_id = ngx.var[1]
                local st = ngx.var.arg_st

                local cache = ngx.shared.stream_auth_cache

                if not cache:get("vod_"..st.."_"..stream_id) then
                return ngx.exit(403)
                end

                cache:expire("vod_"..st.."_"..stream_id,600)
            }

            proxy_pass http://minio:9000/hls-streams/streams/$1/$2;

            proxy_cache dash_cache;

            proxy_cache_key $scheme$proxy_host$request_uri;

            proxy_cache_valid 200 30d;
            proxy_cache_valid 206 0;
            proxy_cache_valid 404 5s;

            proxy_buffering on;

            add_header Cache-Control "public,max-age=31536000,immutable" always;
        }

        location /health {
            return 200 "OK";
        }

    }
}